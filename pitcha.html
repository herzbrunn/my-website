<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משפט פתיחה</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 24px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 0 auto;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      resize: vertical;
      direction: rtl;
      box-sizing: border-box;
    }
    textarea:focus {
      outline: none;
      border-color: #1565c0;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      justify-content: center;
    }
    .btn {
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #0d47a1; }
    .btn.back { background: #757575; }
    .btn.back:hover { background: #616161; }
    #copy-msg {
      display: none;
      text-align: center;
      color: #25d366;
      font-weight: bold;
      font-size: 15px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>משפט פתיחה</h1>
  <div class="card">
    <div style="background: #ff3b00; border-radius: 8px; padding: 14px 18px; margin-bottom: 14px; color: black; font-size: 15px; line-height: 1.8; text-align: center;">
      ⛔ אסור ללחוץ Enter!<br>
      <span style="font-size: 13px;">יש לכתוב את כל המשפט בשורה אחת רציפה.<br>לחיצת Enter תגרום למערכת לא להעתיק את המשפט.</span>
    </div>
    <textarea id="pitcha-text" placeholder="כתוב כאן את משפט הפתיחה בשורה אחת רציפה..." spellcheck="true" lang="he"></textarea>

    <div id="enter-warn" style="display:none; margin-bottom:10px; background:#c00; color:white; font-weight:bold; font-size:18px; padding:10px; border-radius:6px; text-align:center;">⛔ זוהתה ירידת שורה — יש למחוק אותה ולכתוב הכל בשורה אחת</div>
    <div class="btn-row">
      <button class="btn" onclick="copyText()">✅ אישור — העתק</button>
      <a class="btn back" href="milon.html">← חזור</a>
    </div>
    <div id="copy-msg">✅ הועתק ללוח!</div>
  </div>

  <script>
    function copyText() {
      const text = document.getElementById('pitcha-text').value.trim();
      if (!text) return;
      if (text.includes('\n')) {
        document.getElementById('enter-warn').style.display = 'block';
        return;
      }
      document.getElementById('enter-warn').style.display = 'none';

      const longLine = text.split('\n').filter(v => v.trim()).join(' ');
      const pitchaLines = '6240813957פתיחה\n6240813957פתיחה\n6240813957פתיחה\n6240813957פתיחה';
      const result = text + '\n\n\n\n' + longLine + '\n' + pitchaLines;

      navigator.clipboard.writeText(result).then(function() {
        showMsg();
      }).catch(function() {
        const ta = document.createElement('textarea');
        ta.value = result;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showMsg();
      });
    }

    function showMsg() {
      const msg = document.getElementById('copy-msg');
      msg.style.display = 'block';
      setTimeout(function() { msg.style.display = 'none'; }, 2000);
    }
  </script>
</body>
</html>
